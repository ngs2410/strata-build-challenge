[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata"
version = "0.1.0"
description = "Regulatory change-to-action workspace for regulated enterprises"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.50",
  "pydantic>=2.9",
  "structlog>=24.4",
  "diskcache>=5.6",
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn[standard]>=0.32",
  "absl-py>=2.1",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: marks tests as integration (requires external services)",
  "ml: marks tests as ML (slow, model-dependent)",
]
addopts = "-m 'not integration and not ml'"

[tool.ruff]
line-length = 100
target-version = "py312"
indent-width = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N"]
